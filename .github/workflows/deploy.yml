name: Deploy to cPanel

# Tự động build + đẩy lên VinaHost cPanel mỗi khi có code mới trên nhánh main.
on:
  push:
    branches: [main]
  workflow_dispatch: {} # cho phép bấm chạy tay trong tab Actions

# Không cho 2 lần deploy chạy chồng nhau; lần mới hủy lần cũ đang chạy.
concurrency:
  group: deploy-cpanel
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (standalone)
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          DATABASE_URL: "mysql://build:build@127.0.0.1:3306/build"
          # Sheet công khai — set ở build để trang Góc nhìn prerender đúng dữ liệu.
          GOOGLE_SHEET_ID: 1_cPgwf2e7ChPpl8azuNh2K1ki-oBp98Nwd2jqfpRHqY
          GOOGLE_SHEET_NEWS_TAB: News
          GOOGLE_SHEET_VIDEOS_TAB: Videos
        run: npm run build

      - name: Assemble standalone bundle
        run: |
          set -e
          # Next standalone không tự copy static/public — phải gộp vào.
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          # Next standalone đôi khi KHÔNG trace được thư viện chỉ dùng trong Server
          # Action (vd `resend`). Tự tính cây phụ thuộc và copy đủ vào standalone.
          node -e '
            const fs=require("fs"),path=require("path");
            const root="node_modules", dest=".next/standalone/node_modules";
            const ENSURE=["resend"];
            const seen=new Set();
            function walk(name){
              if(seen.has(name))return;
              const dir=path.join(root,name);
              if(!fs.existsSync(path.join(dir,"package.json")))return;
              seen.add(name);
              let pkg={};try{pkg=JSON.parse(fs.readFileSync(path.join(dir,"package.json")))}catch{}
              for(const d of Object.keys(pkg.dependencies||{}))walk(d);
            }
            ENSURE.forEach(walk);
            let n=0;
            for(const name of seen){
              const from=path.join(root,name),to=path.join(dest,name);
              if(fs.existsSync(to))continue;
              fs.mkdirSync(path.dirname(to),{recursive:true});
              fs.cpSync(from,to,{recursive:true});
              n++;
            }
            console.log("Ensured "+n+" server-action deps in standalone:",[...seen].join(", "));
          '
          # Gỡ sharp (file nhị phân theo OS) — đã tắt tối ưu ảnh nên không cần.
          rm -rf .next/standalone/node_modules/sharp .next/standalone/node_modules/@img
          # Không đẩy .env (biến môi trường set trong cPanel).
          rm -f .next/standalone/.env
          # Đổi tmp/restart.txt mỗi lần deploy -> Passenger tự khởi động lại.
          mkdir -p .next/standalone/tmp
          echo "deployed $GITHUB_SHA at $(date -u +%FT%TZ)" > .next/standalone/tmp/restart.txt

      - name: Package standalone archive
        run: |
          set -euo pipefail

          rm -rf .next/standalone/tmp
          rm -rf .next/standalone/prisma

          cp -r prisma .next/standalone/prisma
          cp prisma.config.ts .next/standalone/prisma.config.ts

          tar -C .next/standalone -czf lkc-deploy.tar.gz .

          ls -lh lkc-deploy.tar.gz

      - name: Deploy to cPanel via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -p 22 -H "$SSH_HOST" >> ~/.ssh/known_hosts

          scp \
            -P 22 \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            lkc-deploy.tar.gz \
            "$SSH_USER@$SSH_HOST:/home/$SSH_USER/lkc-deploy.tar.gz"

          ssh \
            -p 22 \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "$SSH_USER@$SSH_HOST" '
              set -e

              APP="/home/edpmjmha/lkcfintech.com.vn/deploy"
              ARCHIVE="/home/edpmjmha/lkc-deploy.tar.gz"

              tar -tzf "$ARCHIVE" >/dev/null

              rm -rf \
                "$APP/.next" \
                "$APP/public" \
                "$APP/node_modules" \
                "$APP/prisma"

              rm -f \
                "$APP/server.js" \
                "$APP/package.json" \
                "$APP/prisma.config.ts"

              tar -xzf "$ARCHIVE" -C "$APP"
              rm -f "$ARCHIVE"

              mkdir -p "$APP/tmp"
              printf "deployed at %s\n" "$(date -u +%FT%TZ)" > "$APP/tmp/restart.txt"
            '
