name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      mode:
        description: "Validation or pinned CMS-009 candidate bundle"
        required: true
        type: choice
        default: validate
        options:
          - validate
          - cms009-candidate

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'validate')
    runs-on: ubuntu-latest

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: "mysql://build:build@127.0.0.1:3306/build"
      GOOGLE_SHEET_ID: "1_cPgwf2e7ChPpl8azuNh2K1ki-oBp98Nwd2jqfpRHqY"
      GOOGLE_SHEET_NEWS_TAB: "News"
      GOOGLE_SHEET_VIDEOS_TAB: "Videos"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Record checkout provenance
        shell: bash
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          CI_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          CI_GITHUB_SHA: ${{ github.sha }}
          CI_GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          printf 'event=%s\npr_number=%s\nsource_head_sha=%s\nbase_sha=%s\ngithub_sha=%s\nref=%s\ncheckout_sha=%s\n' \
            "$CI_EVENT_NAME" "${CI_PR_NUMBER:-N/A}" "$CI_SOURCE_HEAD_SHA" "${CI_BASE_SHA:-N/A}" \
            "$CI_GITHUB_SHA" "$CI_GITHUB_REF" "$checkout_sha"
          test "$checkout_sha" = "$CI_GITHUB_SHA"
          case "$CI_EVENT_NAME" in
            pull_request)
              test -n "$CI_PR_NUMBER"
              test "$CI_GITHUB_REF" = "refs/pull/$CI_PR_NUMBER/merge"
              checkout_parent_line="$(git show -s --format=%P HEAD)"
              read -r -a checkout_parents <<< "$checkout_parent_line"
              test "${#checkout_parents[@]}" -eq 2
              printf 'checkout_kind=pr_synthetic_merge\nmerge_base_parent=%s\nmerge_head_parent=%s\n' \
                "${checkout_parents[0]}" "${checkout_parents[1]}"
              test "${checkout_parents[0]}" = "$CI_BASE_SHA"
              test "${checkout_parents[1]}" = "$CI_SOURCE_HEAD_SHA"
              ;;
            workflow_dispatch)
              printf 'checkout_kind=branch_dispatch\n'
              test "$checkout_sha" = "$CI_SOURCE_HEAD_SHA"
              ;;
            *)
              echo 'Unsupported validation event' >&2
              exit 1
              ;;
          esac

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: Unit and action tests
        run: npm run test:unit

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit --incremental false

      - name: Production build
        run: npm run build

  cms009-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'cms009-candidate'
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: "54238cd55e43b60b4d8cea02a32fc98e82f7762e"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: "mysql://build:build@127.0.0.1:3306/build"
      NEXTAUTH_URL: "http://127.0.0.1:3000"
      GOOGLE_SHEET_ID: ""
      GOOGLE_SHEET_NEWS_TAB: "News"
      GOOGLE_SHEET_VIDEOS_TAB: "Videos"
    steps:
      - name: Checkout workflow packaging helper
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: workflow
          persist-credentials: false

      - name: Checkout pinned application source
        uses: actions/checkout@v4
        with:
          ref: 54238cd55e43b60b4d8cea02a32fc98e82f7762e
          path: source
          persist-credentials: false

      - name: Verify source provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C workflow rev-parse HEAD)" = "$GITHUB_SHA"
          test -f workflow/scripts/cms-media/package-candidate.mjs
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$GITHUB_SHA" != "$SOURCE_SHA" # workflow revision is distinct from application source
          if find source -maxdepth 1 -type f -name '.env*' -print -quit | grep -q .; then echo 'source contains env files' >&2; exit 1; fi
          printf 'source=%s workflow=%s\n' "$SOURCE_SHA" "$GITHUB_SHA"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install pinned dependencies
        working-directory: source
        run: npm ci

      - name: Build and assemble pinned source
        working-directory: source
        run: npm run build

      - name: Smoke assembled bundle before packaging
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test -f .next/standalone/server.js
          node scripts/cms-media/smoke-standalone.mjs .next/standalone > "$RUNNER_TEMP/cms009-smoke.json"
          node --input-type=module -e 'import{readFileSync}from"node:fs";const result=JSON.parse(readFileSync(process.argv[1],"utf8"));if(result.assembledMediaSmoke!=="PASS"||result.worker!=="PNG"||result.lifetimes!==2)process.exit(1)' "$RUNNER_TEMP/cms009-smoke.json"
          cat "$RUNNER_TEMP/cms009-smoke.json"

      - name: Materialize, smoke and package candidate
        shell: bash
        run: |
          set -euo pipefail
          export CANDIDATE_NPM_VERSION="$(npm --version)"
          node workflow/scripts/cms-media/package-candidate.mjs \
            source candidate-package candidate-output "$RUNNER_TEMP/cms009-smoke.json"
          test "$(find candidate-output -maxdepth 1 -type f | wc -l)" -eq 3

      - name: Upload verified candidate
        uses: actions/upload-artifact@v4
        with:
          name: cms009-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
