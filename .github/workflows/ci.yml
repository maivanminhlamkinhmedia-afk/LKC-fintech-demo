name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "Validation or pinned CMS-009 candidate bundle"
        required: true
        type: choice
        default: validate
        options:
          - validate
          - cms009-candidate

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'validate')
    runs-on: ubuntu-latest

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: "mysql://build:build@127.0.0.1:3306/build"
      GOOGLE_SHEET_ID: "1_cPgwf2e7ChPpl8azuNh2K1ki-oBp98Nwd2jqfpRHqY"
      GOOGLE_SHEET_NEWS_TAB: "News"
      GOOGLE_SHEET_VIDEOS_TAB: "Videos"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: Unit and action tests
        run: npm run test:unit

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit --incremental false

      - name: Production build
        run: npm run build

  cms009-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'cms009-candidate'
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: "54238cd55e43b60b4d8cea02a32fc98e82f7762e"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: "mysql://build:build@127.0.0.1:3306/build"
      NEXTAUTH_URL: "http://127.0.0.1:3000"
      GOOGLE_SHEET_ID: ""
      GOOGLE_SHEET_NEWS_TAB: "News"
      GOOGLE_SHEET_VIDEOS_TAB: "Videos"
    steps:
      - name: Checkout pinned application source
        uses: actions/checkout@v4
        with:
          ref: 54238cd55e43b60b4d8cea02a32fc98e82f7762e
          path: source
          persist-credentials: false

      - name: Verify source provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$GITHUB_SHA" != "$SOURCE_SHA" # workflow revision is distinct from application source
          if find source -maxdepth 1 -type f -name '.env*' -print -quit | grep -q .; then echo 'source contains env files' >&2; exit 1; fi
          printf 'source=%s workflow=%s\n' "$SOURCE_SHA" "$GITHUB_SHA"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install pinned dependencies
        working-directory: source
        run: npm ci

      - name: Build and assemble pinned source
        working-directory: source
        run: npm run build

      - name: Smoke assembled bundle before packaging
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test -f .next/standalone/server.js
          node scripts/cms-media/smoke-standalone.mjs .next/standalone > "$RUNNER_TEMP/cms009-smoke.json"
          node --input-type=module -e 'import{readFileSync}from"node:fs";const result=JSON.parse(readFileSync(process.argv[1],"utf8"));if(result.assembledMediaSmoke!=="PASS"||result.worker!=="PNG"||result.lifetimes!==2)process.exit(1)' "$RUNNER_TEMP/cms009-smoke.json"
          cat "$RUNNER_TEMP/cms009-smoke.json"

      - name: Package candidate and provenance
        shell: bash
        run: |
          set -euo pipefail
          test -f source/.next/standalone/server.js
          test -d source/.next/static
          test -d source/public
          test -f source/scripts/cms-media/smoke-standalone.mjs
          test -f source/tests/browser-local/cms-media-lifetime-child.mjs
          if find source/.next/standalone -type l -print -quit | grep -q .; then echo 'standalone contains symlinks' >&2; exit 1; fi
          if find source/.next/standalone -type f -name '.env*' -print -quit | grep -q .; then echo 'standalone contains env files' >&2; exit 1; fi
          mkdir -p candidate-package/cms009-candidate/standalone/.next candidate-package/cms009-candidate/scripts/cms-media candidate-package/cms009-candidate/tests/browser-local candidate-output
          cp -a source/.next/standalone/. candidate-package/cms009-candidate/standalone/
          mkdir -p candidate-package/cms009-candidate/standalone/.next/static candidate-package/cms009-candidate/standalone/public
          cp -a source/.next/static/. candidate-package/cms009-candidate/standalone/.next/static/
          cp -a source/public/. candidate-package/cms009-candidate/standalone/public/
          cp source/scripts/cms-media/smoke-standalone.mjs candidate-package/cms009-candidate/scripts/cms-media/
          cp source/tests/browser-local/cms-media-lifetime-child.mjs candidate-package/cms009-candidate/tests/browser-local/
          if find candidate-package -type l -print -quit | grep -q .; then echo 'candidate contains symlinks' >&2; exit 1; fi
          if find candidate-package -type f -name '.env*' -print -quit | grep -q .; then echo 'candidate contains env files' >&2; exit 1; fi
          archive=cms009-candidate-54238cd.tar.gz
          tar -czf "candidate-output/$archive" -C candidate-package cms009-candidate
          (cd candidate-output && sha256sum "$archive" > "$archive.sha256" && sha256sum --check "$archive.sha256")
          export CANDIDATE_ARCHIVE="$archive"
          export CANDIDATE_NPM_VERSION="$(npm --version)"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const smoke = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/cms009-smoke.json`, 'utf8'))
          if (smoke.assembledMediaSmoke !== 'PASS' || smoke.worker !== 'PNG' || smoke.lifetimes !== 2) throw new Error('CMS009_SMOKE_NOT_PASS')
          const archive = process.env.CANDIDATE_ARCHIVE
          const sha256 = readFileSync(`candidate-output/${archive}.sha256`, 'utf8').split(' ')[0]
          const manifest = { schemaVersion: 1, kind: 'cms009-candidate', sourceSha: process.env.SOURCE_SHA,
            workflowSha: process.env.GITHUB_SHA, workflowRef: process.env.GITHUB_REF,
            runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            node: process.version, npm: process.env.CANDIDATE_NPM_VERSION,
            archive, sha256, smoke, packagedAt: new Date().toISOString(),
            layout: ['standalone', 'scripts/cms-media/smoke-standalone.mjs', 'tests/browser-local/cms-media-lifetime-child.mjs'] }
          writeFileSync('candidate-output/manifest.json', JSON.stringify(manifest, null, 2) + '\n')
          NODE
          test "$(find candidate-output -maxdepth 1 -type f | wc -l)" -eq 3
          tar -tzf "candidate-output/$archive" > "$RUNNER_TEMP/cms009-tar-list"
          grep -Fxq 'cms009-candidate/standalone/server.js' "$RUNNER_TEMP/cms009-tar-list"
          grep -Fxq 'cms009-candidate/scripts/cms-media/smoke-standalone.mjs' "$RUNNER_TEMP/cms009-tar-list"
          grep -Fxq 'cms009-candidate/tests/browser-local/cms-media-lifetime-child.mjs' "$RUNNER_TEMP/cms009-tar-list"

      - name: Upload verified candidate
        uses: actions/upload-artifact@v4
        with:
          name: cms009-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
